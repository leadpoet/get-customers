name: leadpoet
version: "0.2.27"
description: Run /customers yoursite.com and get verified contacts, emails where every personal line shows its source, approval from your phone, and replies you can answer in chat. The first look at who buys from you needs no account.
author: Leadpoet
license: MIT
homepage: https://leadpoet.com
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"
tags:
  - sales
  - inbox
  - outreach
provides_tools:
  - leadpoet_desk_current
  - leadpoet_desk_set_draft
  - leadpoet_customers_status
provides_hooks: []
config_schema:
  api_key:
    type: secret
    env: LEADPOET_API_KEY
    label: Leadpoet API key
    description: "Create one at leadpoet.com/dashboard/account?section=integrations (Developer, API keys, Select all), then run 'hermes config set LEADPOET_API_KEY <your key>'."
    required: false
  allowed_user_ids:
    type: list
    default: []
    label: Group chat users
    description: Platform user ids that may use /customers and /desk in a group chat. Direct messages need no entry.
    required: false
